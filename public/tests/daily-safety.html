<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/style.css"><title>Uji aman Daily · tanpa server data</title><body><main style="max-width:1200px;padding:24px;margin:auto"><h1>UJI DAILY · DATA SIMULASI</h1><p>Tidak mengirim permintaan ke API aplikasi. Tanggal dan ID di bawah hanya data simulasi.</p><button id="allow" class="btn">Izinkan simpan simulasi</button><button id="concurrent" class="btn">Simulasikan pembaruan perangkat lain</button><button id="reset" class="btn">Bersihkan data uji</button><p id="receipt" role="status">Simpan pertama sengaja gagal untuk menguji pemulihan formulir.</p><div id="view"></div></main><script type="module">
import{quickDaily}from'/js/daily-quick.js';
let fail=true,calls=0;
const report={id:901,updated_at:'2026-10-27T01:00:00.000Z',tanggal:'2026-10-27',divisi:'Padi',status:'Selesai',apel_hadir:1.5,photos:[],items:[{id:1,plan_item_id:11,blok:'P01',aktivitas:'Irigasi tanaman & usir burung',satuan:'ha',target:1,realisasi:1,hk_realisasi:1},{id:2,blok:'P01',aktivitas:'Jemur padi',satuan:'kg',target:null,realisasi:108,hk_realisasi:.5}]};
let current=structuredClone(report);const original=JSON.stringify(report),plan={id:51,week_start:'2026-10-26',divisi:'Padi',hk_kegiatan:JSON.stringify([{key:'irigasi tanaman & usir burung|ha',times:5,hk:5}]),items:[{id:11,blok:'P01',aktivitas:'Irigasi tanaman & usir burung',satuan:'ha',target:5}]};
const A={preview:true,isAdmin:()=>false,me:()=>({id:'safe-fixture',nama:'MANDOR UJI',peran:['daily_padi']}),toast:m=>document.querySelector('#receipt').textContent=m,api:{get:async u=>u.includes('locations')?[{nama:'P01',luas_ha:1,divisi:'Padi'}]:u.includes('/plans')?[structuredClone(plan)]:[{...structuredClone(report),id:900,tanggal:'2026-10-26'},structuredClone(current)],post:async(u,b)=>{calls++;if(fail)throw Error('SIMULASI jaringan terputus. Input harus tetap utuh.');if(u!=='/api/daily'||b.id!==901||b.tanggal!=='2026-10-27')throw Error('Data simulasi di luar konteks ditolak');current={...b,id:901,updated_at:'2026-10-27T03:00:00.000Z',photos:[],items:b.items.map((r,i)=>({...r,id:i+100})),hk_kegiatan:JSON.stringify(b.hk_groups)};return structuredClone(current);}}};
document.querySelector('#allow').onclick=()=>{fail=false;document.querySelector('#receipt').textContent='Simpan simulasi diizinkan. Tidak ada koneksi ke database.';};
const open=()=>quickDaily(document.querySelector('#view'),A,structuredClone(current),b=>{document.querySelector('#receipt').textContent='LULUS: tanggal '+b.tanggal+'; '+b.items.length+' kegiatan; '+b.items.reduce((s,r)=>s+r.hk_realisasi,0)+' HK; sumber contoh '+(JSON.stringify(report)===original?'tidak berubah':'BERUBAH')+'; '+calls+' percobaan.';});
document.querySelector('#concurrent').onclick=()=>{current={...current,updated_at:'2026-10-27T02:00:00.000Z',kendala:'CATATAN TERBARU SIMULASI'};open();};document.querySelector('#reset').onclick=()=>{localStorage.removeItem('daily-quick:safe-fixture:2026-10-27:Padi');current=structuredClone(report);fail=true;calls=0;document.querySelector('#receipt').textContent='Data uji dibersihkan; tidak ada laporan online yang disentuh.';open();};await open();
</script></body></html>
