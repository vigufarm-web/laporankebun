<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/style.css"><title>Uji alur mandor</title><body><main style="padding:20px;max-width:1400px;margin:auto"><p>PRATINJAU · DATA UJI · tidak dikirim ke server</p><div class="actions"><button class="btn" id="openPlan">Rencana mingguan</button><button class="btn" id="openActual">Isi realisasi</button></div><p id="result" role="status"></p><div id="view"></div></main><div id="modalHost"></div><script type="module">
import {weeklyWorkForm} from '/js/weekly-work-form.js';import {quickDaily} from '/js/daily-quick.js';
let plan={id:1,week_start:'2026-10-26',divisi:'Pisang',status:'Dikirim',hk_kegiatan:JSON.stringify([{key:'herbisida spray|ha',hk:4,mode:'gis',times:1},{key:'bud injection|stem',hk:2,mode:'manual',times:1}]),items:[{id:1,blok:'D04',aktivitas:'Herbisida spray',satuan:'ha',target:1},{id:2,blok:'D11',aktivitas:'Herbisida spray',satuan:'ha',target:2},{id:3,blok:'D04',aktivitas:'Bud injection',satuan:'stem',target:20},{id:4,blok:'D11',aktivitas:'Bud injection',satuan:'stem',target:60}]};
const locations=[{nama:'D04',divisi:'Pisang',luas_ha:1},{nama:'D11',divisi:'Pisang',luas_ha:2},{nama:'P01',divisi:'Padi',luas_ha:1},{nama:'P04',divisi:'Padi',luas_ha:1.5}];
const A={preview:true,isAdmin:()=>true,me:()=>({id:999,nama:'Mandor uji',peran:['daily_pisang','daily_padi']}),toast:msg=>document.querySelector('#result').textContent=msg,closeModal:()=>document.querySelector('#modalHost').replaceChildren(),openModal:html=>{const wrap=document.createElement('div');wrap.className='modal-wrap';wrap.innerHTML='<div class="modal wide">'+html+'</div>';document.querySelector('#modalHost').replaceChildren(wrap);wrap.querySelector('.x').onclick=A.closeModal;return wrap.querySelector('.modal');},api:{get:async url=>url.includes('locations')?locations:url.includes('kebun-summary')?{blocks:[]}:url.includes('/plans')?[plan]:[],post:async(url,body)=>{if(url.endsWith('/plans')){plan={...body,id:1,hk_kegiatan:JSON.stringify(body.hk_groups),items:body.items.map((r,i)=>({...r,id:i+1}))};return plan;}return {...body,id:1,hk_kegiatan:JSON.stringify(body.hk_groups),photos:[],items:body.items.map((r,i)=>({...r,id:i+1}))};}}};
document.querySelector('#openPlan').onclick=()=>weeklyWorkForm(null,A,()=>{document.querySelector('#result').textContent='Simulasi rencana: '+plan.items.length+' baris; target '+plan.items.map(r=>r.target).join(', ')+'; HK '+JSON.parse(plan.hk_kegiatan).map(g=>g.hk).join(', ');});document.querySelector('#openActual').onclick=()=>quickDaily(document.querySelector('#view'),A,null,b=>{document.querySelector('#result').textContent='Simulasi: tanggal '+b.tanggal+'; '+b.items.length+' blok/kegiatan; alokasi '+b.items.reduce((s,r)=>s+Number(r.hk_realisasi||0),0)+' HK.';});
</script></body></html>
